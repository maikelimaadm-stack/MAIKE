name: quality

# O workflow apenas chama os scripts oficiais do repositório.
# Nenhuma lógica de gate é duplicada aqui.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:all
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL EFÊMERO, criado e destruído com o job.
    #
    # A CI nunca toca banco de produção, de staging, do proprietário nem
    # qualquer PostgreSQL externo: este serviço vive dentro do runner e some
    # com ele. O banco nasce vazio a cada execução, e é justamente isso que
    # transforma o `migrate deploy` do `test:backend` num smoke de migration
    # de graça — se a migration não roda em banco vazio, o job falha aqui.
    #
    # A versão casa com a do docker-compose.yml. Divergir faria a migration ser
    # exercitada num PostgreSQL diferente do que o desenvolvedor usa.
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: maike_ci
          POSTGRES_PASSWORD: maike_ci
          POSTGRES_DB: maike_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maike_ci -d maike_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Exclusiva do job. Some junto com o runner.
      DATABASE_URL: postgresql://maike_ci:maike_ci@localhost:5432/maike_ci
      # Segredo descartável, válido só dentro deste job. Não é segredo real e
      # não vale em nenhum outro ambiente.
      AUTH_SECRET: ci-only-ephemeral-signing-key
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aguardar PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U maike_ci -d maike_ci; then
              echo "PostgreSQL pronto"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não ficou pronto a tempo"
          exit 1

      - name: Verificação completa
        run: npm run verify:all
