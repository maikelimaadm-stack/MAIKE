name: quality

# O workflow apenas chama os scripts oficiais do repositório.
# Nenhuma lógica de gate é duplicada aqui.
#
# Dois perfis, um único check obrigatório (MAIKE-CI-INTELIGENTE-PR01):
#
#   classify  ──┬── verify:docs-fast  (só quando a PR muda apenas Markdown de documentação)
#               └── verify:full       (todo o resto, e SEMPRE em push na main)
#                         │
#                    verify:all       (sempre roda; é o check exigido; só passa se o
#                                      perfil escolhido rodou e passou, e o outro foi pulado)
#
# Não há `paths`/`paths-ignore` no gatilho de propósito: um workflow pulado por
# caminho deixaria o check obrigatório pendente para sempre. A classificação é
# fail-closed — qualquer dúvida vira `full`. Ver scripts/ci/quality-profile.mjs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.perfil.outputs.mode }}
      reason: ${{ steps.perfil.outputs.reason }}
      files_count: ${{ steps.perfil.outputs.files_count }}
    steps:
      # O classificador vem do commit BASE da PR, não da própria PR: quem muda o
      # classificador é julgado pelo classificador já aprovado. Em push, o
      # próprio commit (push é sempre `full`).
      - name: Checkout do classificador (base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Classificar arquivos alterados
        id: perfil
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/ci/quality-profile.mjs ]; then
            node scripts/ci/quality-profile.mjs
          else
            # A base ainda não tem classificador (a PR que o introduz): full.
            {
              echo "mode=full"
              echo "reason=classificador_ausente_na_base"
              echo "files_count=0"
            } >> "$GITHUB_OUTPUT"
            echo "quality-profile: classificador ausente na base; mode=full"
          fi

  docs-fast:
    name: verify:docs-fast
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'docs_fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sem PostgreSQL, sem migrations, sem backend, sem Vitest e sem build. Só os
    # gates estáticos que leem documentação. `npm ci` é necessário: o
    # gate:product-scope importa `typescript`.
    #
    # NÃO defina NODE_ENV aqui (ver o comentário no job verify:full).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: gate:governance-paths
        run: npm run gate:governance-paths

      - name: gate:package-sync
        run: npm run gate:package-sync

      - name: gate:product-scope
        run: npm run gate:product-scope

      - name: gate:no-secrets
        run: npm run gate:no-secrets

      # Lê docs/engineering/DEPLOY-MIGRATION-01-PRODUCTION-MIGRATION-BARRIER-REPORT.md.
      - name: gate:deploy-migrations
        run: npm run gate:deploy-migrations

      - name: test:gates
        run: npm run test:gates

  full:
    name: verify:full
    needs: classify
    if: ${{ needs.classify.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    # A suíte completa (gates + PostgreSQL real + smokes + builds) já leva
    # 16,5–18 min na `main` (nov/2026); com novos domínios passa de 20 e o job
    # era CANCELADO por tempo, sem falha de teste. 30 min dá folga sem
    # esconder travamento (um teste preso ainda estoura o limite).
    timeout-minutes: 30

    # PostgreSQL EFÊMERO, criado e destruído com o job.
    #
    # A CI nunca toca banco de produção, de staging, do proprietário nem
    # qualquer PostgreSQL externo: este serviço vive dentro do runner e some
    # com ele. O banco nasce vazio a cada execução, e é justamente isso que
    # transforma o `migrate deploy` do `test:backend` num smoke de migration
    # de graça — se a migration não roda em banco vazio, o job falha aqui.
    #
    # A versão casa com a do docker-compose.yml. Divergir faria a migration ser
    # exercitada num PostgreSQL diferente do que o desenvolvedor usa.
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: maike_ci
          POSTGRES_PASSWORD: maike_ci
          POSTGRES_DB: maike_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maike_ci -d maike_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Exclusiva do job. Some junto com o runner.
      DATABASE_URL: postgresql://maike_ci:maike_ci@localhost:5432/maike_ci
      # Segredo descartável, válido só dentro deste job. Não é segredo real e
      # não vale em nenhum outro ambiente.
      AUTH_SECRET: ci-only-ephemeral-signing-key
      # Allowlist de CORS do job (P4.0). Origin local, exata, descartável com o
      # runner. Vazio significaria nenhuma origin autorizada — o que é o padrão
      # seguro, mas deixaria os casos de CORS sem nada para exercitar.
      FRONTEND_ORIGINS: http://localhost:5173
      #
      # NÃO defina NODE_ENV aqui.
      #
      # A primeira versão da P3 definia `NODE_ENV: test` neste bloco. Como o
      # `env:` do job alcança TODOS os passos, ele chegava ao `npm run build`, e
      # o Vite produzia o bundle com React e demais bibliotecas em modo de
      # desenvolvimento: 3.555,01 kB medidos na CI contra 2.496,62 kB de build
      # de produção, sem uma linha de `src/` ter mudado. A inflação reproduz
      # igual no commit base `44b204c`, onde não existe backend nenhum — ou
      # seja, não era do backend, era do ambiente.
      #
      # Quem precisa de NODE_ENV declara por conta própria: o Vitest já define
      # `test`, e `verify:all` fixa `production` no passo de build.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aguardar PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U maike_ci -d maike_ci; then
              echo "PostgreSQL pronto"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL não ficou pronto a tempo"
          exit 1

      # D-PROD-122 (PR190-R3): nome de host NÃO literal que chega ao mesmo
      # PostgreSQL efêmero do job, para exercitar o ramo "alvo não local" dos
      # scripts de release sem nenhum banco remoto (dProd122ReleaseFusoR3).
      - name: Alias local para o ramo remoto dos testes de release
        run: echo "127.0.0.1 maike-alvo-teste" | sudo tee -a /etc/hosts

      - name: Verificação completa
        run: npm run verify:all

  # O ÚNICO job com o nome `verify:all`: é o check que as regras da branch exigem.
  # Roda sempre (inclusive se algo falhou ou foi cancelado) e só passa nas duas
  # combinações válidas. Job pulado nunca conta como sucesso por si só.
  required:
    name: verify:all
    needs: [classify, docs-fast, full]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o perfil executado
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUALITY_MODE: ${{ needs.classify.outputs.mode }}
          QUALITY_REASON: ${{ needs.classify.outputs.reason }}
          QUALITY_FILES: ${{ needs.classify.outputs.files_count }}
          DOCS_FAST_RESULT: ${{ needs.docs-fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          # >>> quality-required-gate
          set -eu
          veredito=FAIL
          if [ "${CLASSIFY_RESULT:-}" = success ] && [ "${QUALITY_MODE:-}" = docs_fast ] \
            && [ "${DOCS_FAST_RESULT:-}" = success ] && [ "${FULL_RESULT:-}" = skipped ]; then
            veredito=DOCS_FAST_PASS
          elif [ "${CLASSIFY_RESULT:-}" = success ] && [ "${QUALITY_MODE:-}" = full ] \
            && [ "${FULL_RESULT:-}" = success ] && [ "${DOCS_FAST_RESULT:-}" = skipped ]; then
            veredito=FULL_PASS
          fi
          {
            echo "### verify:all — ${veredito}"
            echo
            echo "| classify | mode | reason | files_count | verify:docs-fast | verify:full |"
            echo "|---|---|---|---|---|---|"
            echo "| ${CLASSIFY_RESULT:-?} | ${QUALITY_MODE:-?} | ${QUALITY_REASON:-?} | ${QUALITY_FILES:-?} | ${DOCS_FAST_RESULT:-?} | ${FULL_RESULT:-?} |"
            echo
            if [ "$veredito" = DOCS_FAST_PASS ]; then
              echo "Perfil docs_fast: só gates estáticos de documentação. A suíte completa NÃO rodou nesta PR; ela roda no push da main."
            elif [ "$veredito" = FULL_PASS ]; then
              echo "Perfil full: npm run verify:all integral, com PostgreSQL efêmero."
            else
              echo "Combinação inválida ou falha: o check obrigatório reprova."
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "verify:all — ${veredito} (classify=${CLASSIFY_RESULT:-?} mode=${QUALITY_MODE:-?} docs-fast=${DOCS_FAST_RESULT:-?} full=${FULL_RESULT:-?})"
          test "$veredito" != FAIL
          # <<< quality-required-gate
