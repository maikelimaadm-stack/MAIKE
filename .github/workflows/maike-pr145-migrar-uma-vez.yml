name: maike-pr145-migrar-uma-vez

# WORKFLOW TEMPORÁRIO DA PR #145 — aplica as 7 migrations pendentes na produção
# pelo runner oficial (`npm run deploy:migrate`), UMA vez, e nada mais.
#
# Inerte por construção:
#  - só dispara quando alguém ADICIONA uma etiqueta à PR (`labeled`); push,
#    synchronize, opened, CI e merge não o acionam;
#  - só segue para a etiqueta exata `maike-pr145-migrar-uma-vez`, posta pelo
#    proprietário na PR 145, mesma repo, branch e base esperadas;
#  - o job com segredo usa o environment `maike-migrations-pr145`: o GitHub
#    segura o job até um revisor aprovar, e só então libera o segredo;
#  - antes de tocar no segredo, o job confere pela API que o environment tem
#    revisor obrigatório e não permite bypass de admin; sem isso, para;
#  - o código executado é o auditado 775d076d + este arquivo, e nada mais.
#
# Não faz limpeza, não cria usuário, não roda seed/teste/reset/db push nem SQL
# manual. A limpeza e a conta `maike` são os SQLs 01/02/03 do SQL Editor, depois.
# REMOVER este arquivo da PR #145 antes do merge.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  elegibilidade:
    name: elegibilidade (sem segredo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Expressões do GitHub comparam texto SEM diferenciar maiúsculas; a
    # conferência exata (case-sensitive) é refeita no passo abaixo.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'maike-pr145-migrar-uma-vez' &&
      github.event.pull_request.number == 145 &&
      github.repository == 'maikelimaadm-stack/MAIKE' &&
      github.event.pull_request.head.repo.full_name == 'maikelimaadm-stack/MAIKE' &&
      github.event.pull_request.base.repo.full_name == 'maikelimaadm-stack/MAIKE' &&
      github.event.pull_request.head.ref == 'claude/catalogo-global-icones-lotes-01' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.sender.login == 'maikelimaadm-stack'
    steps:
      - name: Conferir evento (exato)
        env:
          EVENTO: ${{ github.event_name }}
          ACAO: ${{ github.event.action }}
          ETIQUETA: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REPO_HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          REPO_BASE: ${{ github.event.pull_request.base.repo.full_name }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          REF_HEAD: ${{ github.event.pull_request.head.ref }}
          REF_BASE: ${{ github.event.pull_request.base.ref }}
          QUEM: ${{ github.event.sender.login }}
          DONO: ${{ github.event.repository.owner.login }}
          SHA_HEAD: ${{ github.event.pull_request.head.sha }}
          TENTATIVA: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          falha=0
          exigir() { if [ "$2" != "$3" ]; then echo "NÃO ELEGÍVEL: $1"; falha=1; else echo "ok: $1"; fi; }
          exigir "evento pull_request"            "$EVENTO"    "pull_request"
          exigir "ação labeled"                   "$ACAO"      "labeled"
          exigir "etiqueta exata"                 "$ETIQUETA"  "maike-pr145-migrar-uma-vez"
          exigir "PR 145"                         "$PR"        "145"
          exigir "repositório"                    "$REPO"      "maikelimaadm-stack/MAIKE"
          exigir "repositório de origem"          "$REPO_HEAD" "maikelimaadm-stack/MAIKE"
          exigir "repositório de destino"         "$REPO_BASE" "maikelimaadm-stack/MAIKE"
          exigir "não é fork"                     "$FORK"      "false"
          exigir "branch de origem"               "$REF_HEAD"  "claude/catalogo-global-icones-lotes-01"
          exigir "branch de destino"              "$REF_BASE"  "main"
          exigir "etiqueta posta pelo proprietário" "$QUEM"    "maikelimaadm-stack"
          exigir "proprietário da repo"           "$DONO"      "maikelimaadm-stack"
          exigir "primeira tentativa (sem re-run)" "$TENTATIVA" "1"
          if ! [[ "$SHA_HEAD" =~ ^[0-9a-f]{40}$ ]]; then echo "NÃO ELEGÍVEL: SHA do head"; falha=1; fi
          echo "head do evento: $SHA_HEAD"
          exit "$falha"

  migrar:
    name: migrations de produção (environment protegido)
    needs: elegibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maike-migrations-pr145
    concurrency:
      group: maike-migrations-pr145-producao
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      ENVIRONMENT_NOME: maike-migrations-pr145
      SHA_AUDITADO: 775d076d08114e0c22da6d3c8bd613825a6b912b
      ESTE_ARQUIVO: .github/workflows/maike-pr145-migrar-uma-vez.yml
      SHA_HEAD: ${{ github.event.pull_request.head.sha }}
      MIGRATION_EXPECTED_SYSTEM_IDENTIFIER: '7692130048193495360'
      PENDENTES_ESPERADAS: >-
        20261028250000_catalogo_global_slice1,
        20261028250100_catalogo_global_slice1_schema_fix,
        20261028250200_catalogo_global_slice1_r1_assets,
        20261029100000_scale01_usuario_keyset_index,
        20261029200000_categoria_manejo_vinculo_catalogo,
        20261029300000_admin_principal_maike,
        20261029400000_usuario_papel_tenant
    steps:
      - name: Conferir environment protegido e PR atual (API, sem segredo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"; }
          amb="$(api "environments/$ENVIRONMENT_NOME")"
          revisores="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<<"$amb")"
          bypass="$(jq -r '.can_admins_bypass' <<<"$amb")"
          echo "environment: revisores obrigatórios=$revisores, bypass de admin=$bypass"
          [ "$revisores" -ge 1 ] || { echo "PARAR: environment sem Required reviewers."; exit 1; }
          [ "$bypass" = "false" ] || { echo "PARAR: desligue 'Allow administrators to bypass' no environment."; exit 1; }
          pr="$(api "pulls/145")"
          [ "$(jq -r '.state' <<<"$pr")" = "open" ] || { echo "PARAR: PR 145 não está aberta."; exit 1; }
          [ "$(jq -r '.head.sha' <<<"$pr")" = "$SHA_HEAD" ] || { echo "PARAR: a PR ganhou commit depois da etiqueta."; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$pr")" = "claude/catalogo-global-icones-lotes-01" ] || { echo "PARAR: branch."; exit 1; }
          [ "$(jq -r '.base.ref' <<<"$pr")" = "main" ] || { echo "PARAR: base."; exit 1; }
          echo "ok: environment protegido e PR 145 no head $SHA_HEAD"

      - name: Checkout do SHA exato do head (sem credenciais)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Conferir código = auditado + este arquivo
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA_HEAD" ] || { echo "PARAR: checkout difere do head do evento."; exit 1; }
          [ "$(git rev-parse HEAD^)" = "$SHA_AUDITADO" ] || { echo "PARAR: o pai do head não é o commit auditado."; exit 1; }
          [ "$(git diff --name-only HEAD^ HEAD)" = "$ESTE_ARQUIVO" ] || { echo "PARAR: o head muda algo além deste workflow."; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "PARAR: árvore suja."; exit 1; }
          total="$(find backend/prisma/migrations -mindepth 1 -maxdepth 1 -type d -name '[0-9]*_*' | wc -l)"
          [ "$total" = "25" ] || { echo "PARAR: $total migrations no repositório (esperado 25)."; exit 1; }
          for m in ${PENDENTES_ESPERADAS//,/ }; do
            [ -f "backend/prisma/migrations/$m/migration.sql" ] || { echo "PARAR: falta $m."; exit 1; }
          done
          echo "ok: código auditado $SHA_AUDITADO + $ESTE_ARQUIVO; 25 migrations no repositório"

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Dependências (sem segredo)
        run: |
          npm ci
          npm run prisma:generate

      - name: Leitura — alvo e preflight antes (exige 18/25 e as 7 exatas)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          POSTGRES_PRISMA_URL: ''
          POSTGRES_URL: ''
        run: |
          set +e -uo pipefail  # códigos de saída tratados um a um
          limpar() { sed -E -e 's#postgres(ql)?://[^[:space:]"'"'"']*#<conexao-oculta>#g' -e 's#[A-Za-z0-9.-]+\.supabase\.(co|com)(:[0-9]+)?#<host-oculto>#g' -e 's#(user|role) "[^"]*"#\1 "<oculto>"#g'; }
          [ -n "$MIGRATION_DATABASE_URL" ] || { echo "PARAR: segredo MIGRATION_DATABASE_URL ausente no environment."; exit 1; }
          node scripts/deploy/conferir-alvo-banco.mjs 2>&1 | limpar
          [ "${PIPESTATUS[0]}" = "0" ] || { echo "PARAR: alvo não confere."; exit 1; }
          node scripts/deploy/preflight-schema.mjs --sistema "$MIGRATION_EXPECTED_SYSTEM_IDENTIFIER" > "$RUNNER_TEMP/antes.log" 2>&1
          rc=$?
          limpar < "$RUNNER_TEMP/antes.log" > "$RUNNER_TEMP/antes.txt"; rm -f "$RUNNER_TEMP/antes.log"
          cat "$RUNNER_TEMP/antes.txt"
          esperada="FALHA migrations pendentes (7): $(echo $PENDENTES_ESPERADAS | sed 's/, */, /g')"
          [ "$rc" = "1" ] || { echo "PARAR: preflight antes saiu $rc (esperado 1 = só pendências)."; exit 1; }
          grep -qxF 'alvo: system_identifier confere' "$RUNNER_TEMP/antes.txt" || { echo "PARAR: alvo do preflight."; exit 1; }
          grep -qxF 'migrations: 18/25 aplicadas' "$RUNNER_TEMP/antes.txt" || { echo "PARAR: não está em 18/25."; exit 1; }
          grep -qxF "$esperada" "$RUNNER_TEMP/antes.txt" || { echo "PARAR: as pendentes não são exatamente as 7."; exit 1; }
          if grep -qE 'com falha registrada|consulta falhou' "$RUNNER_TEMP/antes.txt"; then echo "PARAR: falha registrada ou consulta."; exit 1; fi
          echo "ok: alvo conferido, 18/25, pendentes = as 7 esperadas, 0 falhas"

      - name: Migrations — deploy:migrate e repetição (idempotência)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          POSTGRES_PRISMA_URL: ''
          POSTGRES_URL: ''
        run: |
          set +e -uo pipefail  # códigos de saída tratados um a um
          limpar() { sed -E -e 's#postgres(ql)?://[^[:space:]"'"'"']*#<conexao-oculta>#g' -e 's#[A-Za-z0-9.-]+\.supabase\.(co|com)(:[0-9]+)?#<host-oculto>#g' -e 's#(user|role) "[^"]*"#\1 "<oculto>"#g'; }
          npm run deploy:migrate 2>&1 | limpar > "$RUNNER_TEMP/m1.txt"; rc=${PIPESTATUS[0]}
          cat "$RUNNER_TEMP/m1.txt"
          [ "$rc" = "0" ] || { echo "PARAR: deploy:migrate saiu $rc. Não repita; peça revisão."; exit 1; }
          aplicadas="$(grep -c '^Applying migration `' "$RUNNER_TEMP/m1.txt" || true)"
          [ "$aplicadas" = "7" ] || { echo "PARAR: $aplicadas migrations aplicadas (esperado 7)."; exit 1; }
          for m in ${PENDENTES_ESPERADAS//,/ }; do
            grep -qF "Applying migration \`$m\`" "$RUNNER_TEMP/m1.txt" || { echo "PARAR: $m não aparece aplicada."; exit 1; }
          done
          npm run deploy:migrate 2>&1 | limpar > "$RUNNER_TEMP/m2.txt"; rc=${PIPESTATUS[0]}
          cat "$RUNNER_TEMP/m2.txt"
          [ "$rc" = "0" ] || { echo "PARAR: repetição saiu $rc."; exit 1; }
          grep -qF 'No pending migrations to apply.' "$RUNNER_TEMP/m2.txt" || { echo "PARAR: repetição não deu 'No pending'."; exit 1; }
          echo "ok: 7 aplicadas; repetição sem pendências"

      - name: Leitura — alvo e preflight depois (exige 25/25 e OK)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          POSTGRES_PRISMA_URL: ''
          POSTGRES_URL: ''
        run: |
          set +e -uo pipefail  # códigos de saída tratados um a um
          limpar() { sed -E -e 's#postgres(ql)?://[^[:space:]"'"'"']*#<conexao-oculta>#g' -e 's#[A-Za-z0-9.-]+\.supabase\.(co|com)(:[0-9]+)?#<host-oculto>#g' -e 's#(user|role) "[^"]*"#\1 "<oculto>"#g'; }
          node scripts/deploy/conferir-alvo-banco.mjs 2>&1 | limpar
          [ "${PIPESTATUS[0]}" = "0" ] || { echo "PARAR: alvo não confere depois."; exit 1; }
          node scripts/deploy/preflight-schema.mjs --sistema "$MIGRATION_EXPECTED_SYSTEM_IDENTIFIER" 2>&1 | limpar > "$RUNNER_TEMP/depois.txt"; rc=${PIPESTATUS[0]}
          cat "$RUNNER_TEMP/depois.txt"
          [ "$rc" = "0" ] || { echo "PARAR: preflight depois saiu $rc."; exit 1; }
          grep -qxF 'migrations: 25/25 aplicadas' "$RUNNER_TEMP/depois.txt" || { echo "PARAR: não está em 25/25."; exit 1; }
          grep -qxF 'PREFLIGHT OK: o schema atende o código desta branch.' "$RUNNER_TEMP/depois.txt" || { echo "PARAR: preflight não OK."; exit 1; }
          if grep -q '^FALHA ' "$RUNNER_TEMP/depois.txt"; then echo "PARAR: há FALHA no preflight."; exit 1; fi
          echo "CONCLUÍDO: 25/25, RLS e grants das tabelas protegidas conferidos. Próximo passo: SQL Editor 01."
